name: setcap-loong64

on:
  push:
    paths:
      - 'images/build/setcap/**'
      - '.github/workflows/setcap-loong64.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'docker.io' }}
      DOCKER_NAMESPACE: ${{ vars.DOCKER_NAMESPACE || 'xuxiaoweicomcn' }}
      HAS_PUSH: ${{ secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: loongarch64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker
        if: ${{ env.HAS_PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push setcap image for loong64
        env:
          ARCH: loong64
          QEMUIMAGE: xfan1024/qemu-user-static
          QEMUVERSION: latest
          QEMUFLAGS:
          BASEIMAGE: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}/debian-base-loong64:bookworm-v1.0.6
          REGISTRY: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}
          IMAGE_VERSION: bookworm-v1.0.6
        run: |
          cd images/build/setcap
          if [ "$HAS_PUSH" = "true" ]; then make push; else make; fi
      - name: Sync setcap-loong64 to setcap
        if: ${{ env.HAS_PUSH == 'true' }}
        env:
          REGISTRY: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}
        run: |
          SRC_IMAGE="${REGISTRY}/setcap-loong64:bookworm-v1.0.6"
          DST_IMAGE="${REGISTRY}/setcap:bookworm-v1.0.6"
          docker pull --platform linux/loong64 "${SRC_IMAGE}"
          docker tag "${SRC_IMAGE}" "${DST_IMAGE}"
          docker push "${DST_IMAGE}"
