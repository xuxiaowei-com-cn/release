name: go-runner-loong64

on:
  push:
    paths:
      - 'images/build/go-runner/**'
      - '.github/workflows/go-runner-loong64.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'registry.cn-qingdao.aliyuncs.com' }}
      DOCKER_NAMESPACE: ${{ vars.DOCKER_NAMESPACE || 'xuxiaoweicomcn' }}
      HAS_PUSH: ${{ secrets.DOCKER_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: loongarch64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker
        if: ${{ env.HAS_PUSH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push go-runner image for loong64
        env:
          PLATFORMS: linux/loong64
          REGISTRY: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_NAMESPACE }}
          DISTROLESS_REGISTRY: ghcr.io/loong64
          DISTROLESS_IMAGE: debian
          IMAGE_VERSION: v2.4.0-go1.26.2-bookworm.0
        run: |
          cd images/build/go-runner
          if [ "$HAS_PUSH" = "true" ]; then make push; else make; fi
