name: go-runner-loong64

on:
  push:
    paths:
      - 'images/build/go-runner/**'
      - '.github/workflows/go-runner-loong64.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: loongarch64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push go-runner image for loong64
        env:
          PLATFORMS: linux/loong64
          REGISTRY: registry.cn-qingdao.aliyuncs.com/xuxiaoweicomcn
        run: |
          cd images/build/go-runner
          make push
